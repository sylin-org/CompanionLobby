name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tests run against local fakes only; nothing in CI reaches the live network
  # or opens a browser.
  LOBBY_NO_BROWSER: "1"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --yes --no-progress

      - name: Vocabulary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/vocabulary.ps1

      - name: Vocabulary (Linux)
        if: runner.os == 'Linux'
        run: sh tools/vocabulary.sh
