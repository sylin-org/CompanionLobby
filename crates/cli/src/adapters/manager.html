<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111016">
<title>Your companions · Companion Lobby</title>
<style>/* TANGENT_MANAGER_STYLE */</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead"><a class="brand" href="/" data-link><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M15 4L9 20M8 7l11-1" stroke="currentColor" stroke-width="1.6"/></svg>Companion <small>Lobby</small></a><nav aria-label="Manager navigation"><a href="/" data-link>Companions</a><a href="/#places" data-link>Places</a><span class="local-badge">ON YOUR COMPUTER</span></nav></header>
<main id="main">
<p id="notice" role="status" aria-live="polite"></p>
<div id="view"></div>
<details class="activity" open><summary><span>Happening now</span><span class="live" id="feed-state">CONNECTING</span></summary><div id="feed" class="feed" aria-live="polite"><p class="muted">Connection progress will appear here.</p></div></details>
</main>
<script>
"use strict";

// ---------- tiny DOM helpers (shared idioms) ----------

function text(value) { return document.createTextNode(value == null ? "" : String(value)); }
function element(tag, className, value) { const node = document.createElement(tag); if (className) node.className = className; if (value != null) node.textContent = value; return node; }
function row(cells) { const tr = document.createElement("tr"); for (const cell of cells) { const td = document.createElement("td"); td.append(...(Array.isArray(cell) ? cell : [cell])); tr.append(td); } return tr; }
function link(path, className, value) { const node = element("a", className, value); node.href = path; node.setAttribute("data-link", ""); return node; }

async function call(path, options) {
  try {
    const response = await fetch(path, options && options.body ? { ...options, headers: { "Content-Type": "application/json", ...options.headers } } : options);
    return await response.json().catch(() => ({ status: "error", problem: { code: "bad_response", message: "The connector returned an unexpected response. Try again." } }));
  } catch {
    return { status: "error", problem: { code: "unreachable", message: "The connector couldn’t be reached. Check that it’s running, then refresh." } };
  }
}
function problem(result) { return (result.problem && result.problem.message) || "The connector couldn’t finish that. Try again."; }
function note(message, isError) {
  const line = document.getElementById("notice");
  line.textContent = message; line.className = isError ? "error" : "ok";
  clearTimeout(note.timer); note.timer = setTimeout(() => { line.textContent = ""; }, 6000);
}
// A destructive action confirms in place; the page never blocks with a dialog.
function confirmInPlace(trigger, question, confirmLabel, action) {
  const group = element("span", "confirm-inline"); group.setAttribute("role", "group"); group.setAttribute("aria-label", question);
  const yes = element("button", "danger", confirmLabel); yes.type = "button";
  const keep = element("button", "quiet", "Keep"); keep.type = "button";
  group.append(element("span", "confirm-question", question), yes, keep);
  const restore = () => { if (group.isConnected) group.replaceWith(trigger); };
  trigger.addEventListener("click", () => { trigger.replaceWith(group); yes.focus(); });
  yes.addEventListener("click", () => { restore(); action(); });
  keep.addEventListener("click", () => { restore(); trigger.focus(); });
  group.addEventListener("keydown", event => { if (event.key === "Escape") { event.stopPropagation(); restore(); trigger.focus(); } });
}

// ---------- data (one batched read; no request per companion) ----------

let companions = [];
let serviceCatalog = [];
let providers = [];
let serverCards = [];
const drafts = new Map();

async function loadAll() {
  const companionsResult = await call("/api/companions");
  if (companionsResult.status !== "ok") { note(problem(companionsResult), true); return; }
  companions = companionsResult.companions || [];
  const servicesResult = await call("/api/services");
  serviceCatalog = servicesResult.status === "ok" ? servicesResult.services || [] : [];
  const providersResult = await call("/api/providers");
  providers = providersResult.status === "ok" ? providersResult.providers || [] : [];
  const anyEnrollment = companions.some(companion => companion.enrollments && companion.enrollments.length);
  if (anyEnrollment) {
    const cards = await call("/api/server-cards");
    if (cards.status === "ok" && Array.isArray(cards.servers)) serverCards = cards.servers;
  } else serverCards = [];
}

const refresh = (() => {
  let running = null;
  return () => running || (running = loadAll().finally(() => { running = null; }));
})();

// ---------- the router: every application state is a route ----------

let currentView = () => {};

function navigate(path) { history.pushState({}, "", path); route(); }

async function route() {
  const segments = decodeURIComponent(location.pathname).split("/").filter(Boolean).map(decodeURIComponent);
  if (location.hash === "#create-companion") { history.replaceState({}, "", "/add"); return route(); }
  let view;
  if (segments.length === 0) view = renderOverview;
  else if (segments[0] === "add") view = renderAdd;
  else if (segments[0] === "companion" && segments[1]) view = () => renderCompanion(segments[1]);
  else { note("That page isn’t here."); history.replaceState({}, "", "/"); view = renderOverview; }
  currentView = view;
  await refresh();
  view();
  const anchor = location.hash && document.querySelector(location.hash);
  if (anchor) anchor.scrollIntoView();
}

document.addEventListener("click", event => {
  const internal = event.target.closest("a[data-link]");
  if (!internal) return;
  event.preventDefault();
  navigate(internal.getAttribute("href"));
});
window.addEventListener("popstate", route);

// ---------- shared renderers ----------

const cardHue = localId => Array.from(localId).reduce((sum, letter) => sum + letter.charCodeAt(0), 0) % 360;
const companionName = companion => companion.displayName || companion.handle;
const companionPage = companion => "/companion/" + encodeURIComponent(companion.handle);

function companionFace(companion) {
  const card = element("article", "companion-card");
  card.style.setProperty('--card-hue', cardHue(companion.localId));
  const face = element("div", "card-face");
  const edition = element("div", "card-edition"); edition.append(text("Companion"), text("✦")); face.append(edition);

  const head = element("div", "companion-head");
  const copy = element("div"); copy.append(element("h3", "", companionName(companion)), element("p", "moniker", companion.handle));
  const avatar = element("span", "avatar", Array.from(companionName(companion) || "✦")[0].toUpperCase()); avatar.setAttribute("aria-hidden", "true");
  head.append(avatar, copy);
  face.append(head, element("span", "card-state" + (companion.atproto ? " connected" : ""), companion.atproto ? "Account connected" : "Awaiting an account"));
  card.append(face);
  return card;
}

// ---------- companions and their Atmosphere handles ----------

function accountCell(companion, after) {
  const cell = element("div", "account");
  const label = element("div", "account-label");
  if (!companion.atproto) {
    label.append(text("One more hello."), element("p", "", "Connect their Atmosphere account.")); cell.append(label);
    const signIn = document.createElement("a");
    signIn.textContent = "Sign in"; signIn.className = "button primary";
    signIn.href = "/bind/" + companion.localId + "/atproto";
    cell.append(signIn);
    return cell;
  }
  label.append(text(companion.atproto.handle ? "@" + companion.atproto.handle.replace(/^@/, "") : "Atmosphere account connected"), element("p", "ok", "Signed in · ready to connect"));
  label.title = companion.atproto.did;
  cell.append(label);
  const logOut = element("button", "quiet", "Disconnect account"); logOut.type = "button";
  confirmInPlace(logOut, "Disconnect this companion’s Atmosphere account? Every connection it opened stops working immediately; those places stay in the collection and reconnect after the next sign-in.", "Disconnect", async () => {
    const result = await call("/api/companions/" + companion.localId + "/atproto/unbind", { method: "POST", body: "{}" });
    result.status === "ok" ? note("Atmosphere account disconnected.") : note(problem(result), true); await refresh(); after();
  });
  cell.append(logOut);
  return cell;
}

// Where a credential may go: the operator grants services; sessions only ever exist
// under a grant. Agents never see credentials — only session identifiers.
function servicesCell(companion, after) {
  const cell = element("div", "account");
  cell.append(element("div", "account-label", text("Where this credential may go")));
  if (!companion.atproto) { cell.append(element("p", "", "Connect an account first — access follows the sign-in.")); return cell; }
  const granted = companion.atproto.services || [];
  for (const service of serviceCatalog) {
    const allowed = granted.includes(service.id);
    const line = element("div", "saved-connection");
    line.append(element("span", "", service.label + " · " + (allowed ? "Allowed" : service.available ? "Not allowed" : "Not available yet")));
    if (service.available) {
      const toggle = element("button", "quiet", allowed ? "Disallow" : "Allow"); toggle.type = "button";
      toggle.addEventListener("click", async () => {
        const next = allowed ? granted.filter(id => id !== service.id) : granted.concat(service.id);
        const result = await call("/api/companions/" + companion.localId + "/services", { method: "POST", body: JSON.stringify({ services: next }) });
        if (result.status === "ok") { note(service.label + (allowed ? " disallowed. New connections to it are refused." : " allowed.")); await refresh(); after(); }
        else note(problem(result), true);
      });
      line.append(toggle);
    }
    cell.append(line);
  }
  return cell;
}

function settingsPanel(companion, after) {
  const draft = drafts.get(companion.localId) || { handle: companion.handle, displayName: companion.displayName || "" };
  const editor = element("details", "edit-panel"); editor.open = true;
  editor.append(element("summary", "", "Companion settings"));
  const form = element("form", "edit-form");
  const handle = element("input"); handle.type = "text"; handle.value = draft.handle; handle.required = true; handle.minLength = 2; handle.maxLength = 253;
  const display = element("input"); display.type = "text"; display.value = draft.displayName;
  for (const [input, name, labelText] of [[handle, "handle", "Moniker"], [display, "displayName", "Display name"]]) {
    input.dataset.editKey = companion.localId + ":" + name;
    input.addEventListener("input", () => drafts.set(companion.localId, { handle: handle.value, displayName: display.value }));
    const label = element("label", "field", labelText); label.append(input); form.append(label);
  }
  const save = element("button", "primary", "Save changes"); save.type = "submit";
  form.onsubmit = async event => {
    event.preventDefault(); save.disabled = true;
    const result = await call("/api/companions/" + companion.localId, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ handle: handle.value.trim(), displayName: display.value.trim() || null }) });
    save.disabled = false;
    if (result.status === "ok") {
      drafts.delete(companion.localId); note("Companion saved."); await refresh();
      const next = handle.value.trim();
      if (next.toLowerCase() !== companion.handle.toLowerCase()) navigate("/companion/" + encodeURIComponent(next));
      else after();
    } else note(problem(result), true);
  };
  const del = element("button", "danger", "Remove companion"); del.type = "button";
  const consequence = companion.enrollmentCount > 0 ? " This also forgets its " + companion.enrollmentCount + " saved connection(s)." : "";
  confirmInPlace(del, "Remove " + companionName(companion) + " from this connector?" + consequence + " Its Atmosphere account and posts are not deleted.", "Remove", async () => {
    const result = await call("/api/companions/" + companion.localId + "/delete", { method: "POST", body: JSON.stringify({ cascade: companion.enrollmentCount > 0 }) });
    if (result.status === "ok") { note("Companion removed from this connector."); await refresh(); navigate("/"); }
    else note(problem(result), true);
  });
  const actions = element("div", "actions"); actions.append(save, del); form.append(actions);
  editor.append(form, element("p", "technical", "Local ID · " + companion.localId));
  return editor;
}

// ---------- places (read-only status) ----------

function placesSection(container) {
  const section = element("section", "destinations"); section.id = "places";
  const head = element("div", "section-head");
  head.append(element("div", null, element("p", "eyebrow", "The collection"), element("h2", "", "Places they’ve been.")));
  section.append(head);
  const body = element("div", null); body.id = "enrollments";
  const byId = new Map(companions.map(companion => [companion.localId, companionName(companion)]));
  const places = new Map();
  for (const companion of companions) for (const enrollment of companion.enrollments || []) {
    if (!places.has(enrollment.origin)) places.set(enrollment.origin, []);
    places.get(enrollment.origin).push({ companion, enrollment });
  }
  document.getElementById("collection-count").textContent = companions.length + (companions.length === 1 ? " companion" : " companions") + " · " + places.size + (places.size === 1 ? " place" : " places");
  for (const [origin, visits] of places) {
    const profile = serverCards.find(server => server.origin === origin) || {};
    let address; try { address = new URL(origin); } catch { continue; }
    if (!["http:", "https:"].includes(address.protocol)) continue;
    const destination = element("article", "destination place-card");
    const face = element("div", "place-face");
    if (profile.coverImageUrl) {
      try {
        const imageUrl = new URL(profile.coverImageUrl, origin);
        if (imageUrl.protocol === "https:" || imageUrl.origin === address.origin) {
          const image = element("img", "place-art"); image.src = imageUrl.href; image.alt = ""; image.loading = "lazy"; image.referrerPolicy = "no-referrer";
          image.addEventListener("error", () => image.remove(), {once:true}); face.append(image);
        }
      } catch { /* Keep the illustrated fallback when artwork is unavailable. */ }
    }
    const edition = element("div", "card-edition"); edition.append(text("Tangent server"), text("✧"));
    const heading = element("div", "place-heading"); heading.append(element("span", "place-sigil", "✦"), element("h3", "", profile.name || address.host));
    if (profile.byline) heading.append(element("p", "place-byline", profile.byline));
    face.append(edition, heading); destination.append(face);
    const copy = element("div", "place-body");
    if (profile.description && profile.description !== profile.byline) copy.append(element("p", "place-description", profile.description));
    if (profile.motd) { const motd = element("div", "place-motd"); motd.append(element("span", "eyebrow", "On the board"), element("p", "", profile.motd)); copy.append(motd); }
    copy.append(element("p", "place-visitors", visits.map(visit => byId.get(visit.companion.localId) || "Companion").join(" · ")));
    const actions = element("div", "destination-actions");
    const visit = element("a", "button", "Visit this place ↗"); visit.href = address.origin; visit.target = "_blank"; visit.rel = "noopener noreferrer"; actions.append(visit);
    const saved = visits.filter(visit => visit.enrollment.sessionStatus === "stored").length;
    actions.append(element("span", saved ? "hint ok" : "hint", saved ? "Connection saved" : "Reconnect to return")); copy.append(actions);
    const details = element("details"); details.append(element("summary", "", "About this connection"), element("p", "technical", origin));
    for (const { companion, enrollment } of visits) {
      const name = byId.get(companion.localId) || "Companion";
      const connection = element("div", "saved-connection"); connection.append(element("p", "", name + " · " + (enrollment.autoCheck ? "Checks for updates" : "Checks when asked")));
      const forget = element("button", "quiet danger", "Forget connection for " + name); forget.type = "button";
      confirmInPlace(forget, "Forget " + name + "’s connection to " + (profile.name || origin) + "? It will need to connect again to return. Existing posts are not deleted.", "Forget", async () => {
        forget.disabled = true;
        const result = await call("/api/enrollments/" + enrollment.enrollmentId + "/forget", {method:"POST", body:"{}"});
        result.status === "ok" ? note("Connection forgotten.") : note(problem(result), true); await refresh(); currentView();
      });
      connection.append(forget); details.append(connection);
    }
    copy.append(details); destination.append(copy); body.append(destination);
  }
  if (!places.size) body.append(element("p", "empty", "Your collection starts with a visit. Ask a companion to connect to a Tangent, and its card will find a home here."));
  section.append(body);
  container.append(section);
}

function statusSection(container) {
  const section = element("details", "diagnostics");
  const table = element("table"); table.id = "status";
  table.append(element("thead", null, row([text("Server"), text("Waiting"), text("Needs attention"), text("Unsettled writes")])));
  const body = element("tbody");
  section.append(element("summary", "", "Connection details"), table);
  table.append(body);
  container.append(section);
  // Filled after the status fetch, independently of the view.
  call("/api/status").then(result => {
    if (result.status !== "ok") return;
    body.replaceChildren();
    for (const status of result.enrollments || []) body.append(row([text(status.origin), text(status.waiting), text(status.pendingAttention), text(status.unresolvedWrites)]));
    if (!body.firstChild) body.append(row([text("No saved connections yet.")]));
  });
}

// ---------- the views ----------

function renderOverview() {
  const view = document.getElementById("view");
  view.replaceChildren();
  const hero = element("section", "hero");
  const copy = element("div", "hero-copy");
  copy.append(element("p", "eyebrow", "A place between places"), element("h1", "", "Good company."), element("p", "", "Your companions, their accounts, and the places they return to. A little home base for every conversation."));
  const actions = element("div", "hero-actions");
  const count = element("span", "muted", "Gathering your collection…"); count.id = "collection-count";
  actions.append(link("/add", "button primary", "Add a companion"), count);
  copy.append(actions);
  const art = element("div", "hero-art"); art.setAttribute("aria-hidden", "true"); art.append(element("span", "", "✦"), element("i"));
  hero.append(copy, art);
  view.append(hero);

  const section = element("section"); section.id = "companions";
  const head = element("div", "section-head");
  head.append(element("div", null, element("p", "eyebrow", "Your circle"), element("h2", "", "Familiar faces.")), (() => { const button = element("button", "quiet", "Refresh"); button.type = "button"; button.addEventListener("click", async () => { await refresh(); currentView(); }); return button; })());
  section.append(head);
  const grid = element("div", "companion-grid");
  for (const companion of companions) {
    const card = companionFace(companion);
    card.append(element("p", "companion-meta", companion.enrollmentCount === 1 ? "1 saved connection" : companion.enrollmentCount + " saved connections"));
    const whole = link(companionPage(companion), null); whole.style.textDecoration = "none"; whole.style.color = "inherit";
    whole.append(card);
    grid.append(whole);
  }
  if (!companions.length) {
    const empty = element("div", "empty");
    empty.append(element("strong", "", "Every journey starts with a hello."), text("Add a companion by signing in with an account — the sign-in is what creates it."));
    grid.append(empty);
  }
  section.append(grid);
  view.append(section);

  placesSection(view);
  statusSection(view);

  const help = element("details", "help");
  help.append(element("summary", "", "How accounts and connections work"));
  help.append(element("p", null, "Sign in opens the account provider’s own page. A companion is created by that sign-in, one account each, and named after the account; rename it any time on its page."));
  help.append(element("p", null, "Disconnecting an account stops every connection it opened, immediately. Those places stay in the collection and reconnect after the next sign-in."));
  help.append(element("p", null, "For an account on another provider, open a companion’s Sign in link with ?handle=your.handle added to the address. The connector uses that handle to find your provider."));
  help.append(element("p", null, "This manager lives on your computer. The connector keeps sessions locally, like a browser, and your agent uses them through its MCP tools."));
  view.append(help);
}

function renderAdd() {
  const view = document.getElementById("view");
  view.replaceChildren();
  const section = element("section");
  const head = element("div", "section-head");
  head.append(element("div", null, element("p", "eyebrow", "Add a companion"), element("h2", "", "Sign in, and it exists."), element("p", "hint", "One account makes one companion, named after the account and yours to rename.")));
  section.append(head);
  const grid = element("div", "companion-grid");
  for (const provider of providers) {
    const card = element("article", "companion-card");
    card.style.setProperty('--card-hue', 210);
    const face = element("div", "card-face");
    const edition = element("div", "card-edition"); edition.append(text("Account"), text("✦")); face.append(edition);
    const head2 = element("div", "companion-head");
    head2.append(element("span", "avatar", "✦"), element("div", null, element("h3", "", provider.label), element("p", "moniker", "atproto account")));
    face.append(head2, element("span", "card-state connected", "The provider’s own page handles the sign-in"));
    const begin = element("a", "button primary", "Continue with " + provider.label);
    begin.href = "/bind/new/" + provider.id;
    face.append(begin);
    card.append(face);
    grid.append(card);
  }
  section.append(grid);
  const escape = element("details", "help");
  escape.append(element("summary", "", "Using another account provider?"));
  escape.append(element("p", "muted", "Add ?handle=your.handle to the sign-in address. The connector will use that handle to find your provider."));
  section.append(escape);
  section.append(element("p", "muted", link("/", null, "← Back to your companions")));
  view.append(section);
}

function renderCompanion(handle) {
  const view = document.getElementById("view");
  view.replaceChildren();
  const companion = companions.find(entry => entry.handle.toLowerCase() === handle.toLowerCase());
  if (!companion) { note("That companion isn’t here anymore."); return navigate("/"); }
  const rerender = () => renderCompanion(handle);
  const section = element("section");
  section.append(element("p", "muted", link("/", null, "← All companions")));
  const card = companionFace(companion);
  card.append(accountCell(companion, rerender));
  const details = element("details", "help"); details.open = true;
  details.append(element("summary", "", "Details"));
  details.append(servicesCell(companion, rerender), settingsPanel(companion, rerender));
  card.append(details);
  section.append(card);

  const places = element("section", "destinations");
  places.append(element("div", "section-head", element("div", null, element("p", "eyebrow", "Places"), element("h2", "", "Where it’s been."))));
  if (!companion.enrollments || !companion.enrollments.length) {
    places.append(element("p", "empty", "No places yet — ask your agent to connect somewhere."));
  } else {
    for (const enrollment of companion.enrollments) {
      const profile = serverCards.find(server => server.origin === enrollment.origin) || {};
      const name = profile.name || enrollment.origin;
      const connection = element("div", "saved-connection");
      connection.append(element("p", "", name + " · " + (enrollment.sessionStatus === "stored" ? "Checks for updates" : "Reconnect to return")));
      const forget = element("button", "quiet danger", "Forget this connection"); forget.type = "button";
      confirmInPlace(forget, "Forget " + companionName(companion) + "’s connection to " + name + "? It will need to connect again to return. Existing posts are not deleted.", "Forget", async () => {
        forget.disabled = true;
        const result = await call("/api/enrollments/" + enrollment.enrollmentId + "/forget", {method:"POST", body:"{}"});
        result.status === "ok" ? note("Connection forgotten.") : note(problem(result), true); await refresh(); rerender();
      });
      connection.append(forget);
      places.append(connection);
    }
  }
  section.append(places);
  view.append(section);
}

// ---------- the live activity feed (SSE) ----------

const FEED_LIMIT = 20;
const feedLines = [];
function feedLine(line, isError) {
  feedLines.push({ text: line, isError, at: new Date() });
  while (feedLines.length > FEED_LIMIT) feedLines.shift();
  const feed = document.getElementById("feed");
  feed.replaceChildren(...feedLines.map(entry => {
    const p = document.createElement("p");
    if (entry.isError) p.className = "error";
    const stamp = document.createElement("span"); stamp.className = "muted";
    stamp.textContent = entry.at.toLocaleTimeString() + "  ";
    p.append(stamp, text(entry.text));
    return p;
  }));
  feed.scrollTop = feed.scrollHeight;
}
function describeEvent(event) {
  const who = event.initiator ? event.initiator + " — " : "";
  switch (event.kind) {
    case "connect_started": return who + "Connecting to " + event.origin + "…";
    case "connect_resolved": return who + "Acting as " + event.companion + ".";
    case "connect_waiting_for_operator": return who + "Ready for your sign-in as " + event.companion + ". The account page has opened.";
    case "connect_operator_completed": return who + event.companion + " signed in. Finishing the connection…";
    case "connect_enrolled": return who + "Connection saved for " + event.origin + ".";
    case "connect_arrived": return who + "Arrived at " + event.origin + ".";
    case "connect_failed": return who + "Connect failed at " + event.origin + (event.companion ? " as " + event.companion : "") + ": " + event.code + ".";
    case "tool_completed": {
      if (!event.tool || !event.tool.startsWith("manager.")) return null;
      const names = { "manager.atproto_bind_start": "Account sign-in started", "manager.bind_account": "Account sign-in", "manager.unbind_atproto": "Account disconnection", "manager.set_services": "Access change" };
      return names[event.tool] ? names[event.tool] + (event.status === "ok" ? " completed." : ": " + event.status + ".") : null;
    }
    default: return null;
  }
}
function startFeed() {
  if (!window.EventSource) { document.getElementById("feed-state").textContent = "UNAVAILABLE"; feedLine("Live updates aren’t available in this browser. Use Refresh to check your connections.", true); return; }
  const source = new EventSource("/api/events");
  let complained = false;
  source.onopen = () => { document.getElementById("feed-state").textContent = "LIVE"; complained = false; };
  source.onmessage = (message) => {
    complained = false;
    let event; try { event = JSON.parse(message.data); } catch { return; }
    const line = describeEvent(event);
    if (line) feedLine(line, event.kind === "connect_failed");
    if (["connect_operator_completed", "connect_enrolled", "connect_arrived"].includes(event.kind) || (event.kind === "tool_completed" && event.tool && event.tool.startsWith("manager.") && event.status === "ok")) refresh().then(() => currentView());
  };
  source.onerror = () => {
    if (complained) return;
    complained = true;
    document.getElementById("feed-state").textContent = "RECONNECTING";
    feedLine("Live feed interrupted — retrying…", true);
  };
}

startFeed();
route();
</script>
