[package]
name = "lobby-daemon"
description = "The Companion Lobby daemon and the companion-lobby command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "lobby_daemon"
path = "src/lib.rs"

[[bin]]
name = "companion-lobby"
path = "src/main.rs"

# The same command with the test kit's synthetic adapters in its registry,
# for the journeys that prove the host through them. It exists only when
# the synthetic feature is on, which only the test builds turn on, through
# the dev-dependency on this crate below; companion-lobby never contains it.
[[bin]]
name = "companion-lobby-synthetic"
path = "src/bin/synthetic.rs"
required-features = ["synthetic"]

[features]
synthetic = ["dep:lobby-testkit"]

[dependencies]
lobby-contracts.workspace = true
lobby-outbound.workspace = true
lobby-credential-atproto.workspace = true
lobby-service-tangent.workspace = true
lobby-service-bluesky.workspace = true
lobby-testkit = { workspace = true, optional = true }
bytes.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
netstat2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(not(windows))'.dependencies]
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
lobby-conformance.workspace = true
lobby-daemon = { workspace = true, features = ["synthetic"] }
lobby-testkit.workspace = true

[target.'cfg(windows)'.dev-dependencies]
win32job.workspace = true

[lints]
workspace = true
